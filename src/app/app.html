<div style="font-family: Arial, sans-serif; max-width: 800px; margin: 0 auto; padding: 20px;">
  <h1>Angular Lifecycle Hooks Demonstration</h1>

  <div style="margin-bottom: 20px; display: flex; gap: 10px;">
    <button (click)="toggleDemo()"
      style="padding: 10px 20px; cursor: pointer; background-color: #6c757d; color: white; border: none; border-radius: 4px;">
      {{ showDemo() ? 'Destroy' : 'Create' }} Component
    </button>
    <button (click)="updateData()" [disabled]="!showDemo()"
      style="padding: 10px 20px; cursor: pointer; background-color: #007bff; color: white; border: none; border-radius: 4px;">
      Update Input Data
    </button>
    <button routerLink="/lifecycle-demo"
      style="padding: 10px 20px; cursor: pointer; background-color: #28a745; color: white; border: none; border-radius: 4px;">
      Lifecycle Hooks
    </button>
    <button routerLink="/data-binding"
      style="padding: 10px 20px; cursor: pointer; background-color: #ffc107; color: black; border: none; border-radius: 4px;">
      Data Binding
    </button>
    <button routerLink="/practice"
      style="padding: 10px 20px; cursor: pointer; background-color: #17a2b8; color: white; border: none; border-radius: 4px;">
      Practice
    </button>
    <button routerLink="/counter"
      style="padding: 10px 20px; cursor: pointer; background-color: #6f42c1; color: white; border: none; border-radius: 4px;">
      Counter
    </button>
    <button routerLink="/directives"
      style="padding: 10px 20px; cursor: pointer; background-color: #e83e8c; color: white; border: none; border-radius: 4px;">
      Directives
    </button>
    <button routerLink="/pipe-examples"
      style="padding: 10px 20px; cursor: pointer; background-color: #fd7e14; color: white; border: none; border-radius: 4px;">
      Pipe Examples
    </button>
    <button routerLink="/sharing-data"
      style="padding: 10px 20px; cursor: pointer; background-color: #e83e8c; color: white; border: none; border-radius: 4px;">
      Sharing Data
    </button>
  </div>

  <div *ngIf="showDemo()"
    style="background-color: #f8f9fa; border: 1px solid #dee2e6; border-radius: 8px; padding: 1px;">
    <app-lifecycle-hooks-example></app-lifecycle-hooks-example>
  </div>

  <div style="margin-top: 40px; padding: 15px; background-color: #e9ecef; border-radius: 8px;">
    <h3>Instruction:</h3>
    <ol>
      <li>Open your browser's Developer Tools (F12) and go to the <strong>Console</strong> tab.</li>
      <li>Click <strong>Destroy Component</strong> to see <code>ngOnDestroy</code>.</li>
      <li>Click <strong>Create Component</strong> to see the full creation sequence.</li>
      <li>Click <strong>Update Input Data</strong> to see the update sequence.</li>
    </ol>
  </div>

  <router-outlet></router-outlet>
</div>
